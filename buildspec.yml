version: 0.2

env:
  variables:
    ECR_REPO_URI: 849248223156.dkr.ecr.us-east-2.amazonaws.com/app_devops
    CONTAINER_NAME: contenedor-devops

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo Installing dependencies...
      - npm i
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 849248223156.dkr.ecr.us-east-2.amazonaws.com
  build:
    on-failure: ABORT
    commands:
      - echo Building application...
      - npm run build --if-present
      - echo Running tests...
      - npm test
      - echo Building Docker image...
      - docker build -t $ECR_REPO_URI:latest .
      - docker tag $ECR_REPO_URI:latest $ECR_REPO_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION
  post_build:
    on-failure: ABORT
    commands:
      - echo Pushing image to ECR...
      - docker push $ECR_REPO_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION
      - echo Writing imagedefinitions.json...
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $ECR_REPO_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
